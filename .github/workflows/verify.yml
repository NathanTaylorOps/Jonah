name: Verify Monday Control
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check functional model
        run: node test.js
      - name: Check prohibited internal references in employer materials
        run: |
          if grep -Ein '(max felker|ivy|openai|chatgpt|recruiter|generated by ai|ai-assisted)' assessment.md index.html README.md; then
            echo "Employer-facing language check failed."
            exit 1
          fi
