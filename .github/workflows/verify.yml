name: Verify Monday Control
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scenarios and arithmetic
        run: node test.js
      - name: Check for unfinished submission placeholders
        run: |
          if grep -Ein 'TODO|TBD|insert (name|date|duration)|record actual|fill in here|lorem ipsum' assessment.md index.html README.md; then
            echo "Unfinished submission placeholder found."
            exit 1
          fi
